steps:
  # [IMAGE]: Build
  - name: 'gcr.io/cloud-builders/docker'
    id: 'Build'
    env:
      - 'DOCKER_BUILDKIT=1'
    args:
      - 'build'
      - '--platform=linux/amd64'
      - '--build-arg'
      - 'DATABASE_URL=$_DATABASE_URL'
      - '-t'
      - '$_IMAGE_NAME:$_IMAGE_VERSION'
      - '-f'
      - '$_DOCKERFILE_PATH'
      - '.'

  # [IMAGE]: Push
  - name: 'gcr.io/cloud-builders/docker'
    id: 'Push'
    args:
      - 'push'
      - '$_IMAGE_NAME:$_IMAGE_VERSION'

  # Deploy container image to Cloud Run
  - name: 'gcr.io/cloud-builders/gcloud'
    id: 'Deploy'
    entrypoint: 'gcloud'
    args:
      - 'run'
      - 'deploy'
      - '$_SERVICE_NAME'
      - '--image'
      - '$_IMAGE_NAME:$_IMAGE_VERSION'
      - '--region'
      - '$_SERVICE_REGION'
      - '--service-account=$_SERVICE_ACCOUNT_ID'
      - '--allow-unauthenticated'
      - '--add-cloudsql-instances=$_INSTANCE_CONNECTION_NAME'
      # ENV DATABASE
      - '--set-env-vars'
      - 'DATABASE_URL=$_DATABASE_URL'
      # ENV JWT
      - '--set-env-vars'
      - 'JWT_ACCESS_SECRET=$_JWT_ACCESS_SECRET,JWT_REFRESH_SECRET=$_JWT_REFRESH_SECRET'
      # ENV BUCKET
      - '--set-env-vars'
      - 'GCP_BUCKET_NAME=$_GCP_BUCKET_NAME,GCP_PROJECT_ID=$_GCP_PROJECT_ID'
      # ENV FRONTEND URL
      - '--set-env-vars'
      - 'FRONTEND_URL=$_FRONTEND_URL'
      # ENV IDAMAN
      - '--set-env-vars'
      - 'IDAMAN_URL=$_IDAMAN_URL,IDAMAN_REST_URL=$_IDAMAN_REST_URL,IDAMAN_CLIENT_ID=$_IDAMAN_CLIENT_ID,IDAMAN_CLIENT_SECRET=$_IDAMAN_CLIENT_SECRET,IDAMAN_GRANT_TYPE=$_IDAMAN_GRANT_TYPE,IDAMAN_SCOPE=$_IDAMAN_SCOPE'
      # ENV EMAIL (MAILTRAP)
      - '--set-env-vars'
      - 'MAILTRAP_SENDER=$_MAILTRAP_SENDER,MAILTRAP_HOST=$_MAILTRAP_HOST,MAILTRAP_PORT=$_MAILTRAP_PORT,MAILTRAP_USER=$_MAILTRAP_USER,MAILTRAP_PASS=$_MAILTRAP_PASS'
      # ENV SERVICES
      - '--set-env-vars'
      - 'NODE_ENV=$_NODE_ENV,ENCRYPTION_KEY=$_ENCRYPTION_KEY'
      # ENV VERTEX AI
      - '--set-env-vars'
      - 'VERTEX_AI_PROJECT=$_VERTEX_AI_PROJECT,VERTEX_AI_LOCATION=$_VERTEX_AI_LOCATION,VERTEX_AI_MODEL=$_VERTEX_AI_MODEL'
      # ENV OTHERS
      - '--set-env-vars'
      - 'PMTOOLS_API_URL=$_PMTOOLS_API_URL'
      # API KEYS
      # - '--set-env-vars'
      # - 'API_KEYS=$_API_KEYS'

