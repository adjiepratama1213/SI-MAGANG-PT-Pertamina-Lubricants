# Project identification
sonar.projectKey=post-it
sonar.projectName=post-it
sonar.projectVersion=1.0

# Local SonarQube URL
sonar.host.url=http://localhost:9000
sonar.login=YOUR_TOKEN
# get from http://localhost:9000/account/security

# Source file location
sonar.sources=src
sonar.language=ts
sonar.sourceEncoding=UTF-8

# TypeScript settings
sonar.typescript.lcov.reportPaths=coverage/lcov.info

# Node.js executable path (if needed)
sonar.nodejs.executable=YOUR_NODE_JS_PATH

